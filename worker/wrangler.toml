# Configurazione del Worker "wintersports" (piano gratuito Cloudflare)
name = "wintersports"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# La PWA (cartella web/) è servita come file statici dallo stesso Worker:
# un solo deploy, stesso dominio, richieste statiche gratuite e illimitate.
[assets]
directory = "../web"
binding = "ASSETS"

# Database chiave-valore: l'id viene creato con `wrangler kv namespace create KV`
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

# Un solo cron ogni 10 minuti: il Worker decide da sé se lavorare
# (sempre nei giorni di gara, altrimenti ogni ~30 minuti).
[triggers]
crons = ["*/10 * * * *"]

[vars]
BUDGET_RESULTS = "4"
BUDGET_PROBES = "12"

[observability]
enabled = true
